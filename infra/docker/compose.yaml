services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecare_connect
      POSTGRES_USER: ecare
      POSTGRES_PASSWORD: ecare_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ecare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecare -d ecare_connect"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  ecare_pgdata:
